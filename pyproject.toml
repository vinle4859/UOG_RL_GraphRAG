[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uog-rl-graphrag"
version = "0.1.0"
description = "Benchmarking self-built GraphRAG vs standard RAG on ArXiv research papers"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "UOG RL Team"},
]

dependencies = [
    # --- Core ---
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "click>=8.0",              # CLI interface

    # --- Data Processing ---
    "pandas>=2.0",
    "tiktoken>=0.5",           # Token counting for chunking

    # --- Embeddings ---
    "sentence-transformers>=2.2",
    "openai>=1.0",

    # --- Vector Stores ---
    "chromadb>=0.4",
    "faiss-cpu>=1.7",

    # --- Graph ---
    "networkx>=3.0",
    "pyvis>=0.3",              # Graph visualization
    "python-igraph>=0.11",
    "leidenalg>=0.10",         # Community detection (Leiden algorithm)

    # --- Evaluation ---
    "scikit-learn>=1.3",
    "rouge-score>=0.1",
    "nltk>=3.8",

    # --- Utilities ---
    "numpy>=1.26",
    "requests>=2.31",
    "tqdm>=4.65",
    "rich>=13.0",              # Pretty console output
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",               # Linting & formatting
    "pre-commit>=3.0",
    "mypy>=1.0",
]
notebooks = [
    "jupyter>=1.0",
    "ipywidgets>=8.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "plotly>=5.15",
]
neo4j = [
    "neo4j>=5.0",
    "langchain-neo4j>=0.1",
]
ollama = [
    "langchain-ollama>=0.1",
]

[project.scripts]
rag-bench = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]

# --- Ruff (Linter & Formatter) ---
[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# --- Pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

# --- MyPy ---
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
